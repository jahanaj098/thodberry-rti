<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Manage RTIs | Admin | Thodberry RTI Intelligence</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/components.css">

    <style>
        .admin-nav {
            background: var(--color-background-elevated);
            border-bottom: 1px solid var(--color-border);
            padding: var(--space-4) 0;
            margin-bottom: var(--space-6);
        }

        .admin-nav-links {
            display: flex;
            gap: var(--space-4);
        }

        .admin-nav-link {
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-md);
            text-decoration: none;
            color: var(--color-text-secondary);
            transition: all var(--transition-fast);
        }

        .admin-nav-link:hover,
        .admin-nav-link.active {
            background: var(--color-primary);
            color: white;
            text-decoration: none;
        }

        .rti-actions {
            display: flex;
            gap: var(--space-2);
            margin-top: var(--space-3);
        }
    </style>
</head>

<body>

    <!-- Admin Navigation -->
    <nav class="admin-nav">
        <div class="container">
            <div class="flex justify-between items-center">
                <div class="admin-nav-links">
                    <a href="dashboard.html" class="admin-nav-link">📊 Dashboard</a>
                    <a href="upload.html" class="admin-nav-link">📤 Upload RTI</a>
                    <a href="manage.html" class="admin-nav-link active">📝 Manage</a>
                </div>
                <div class="flex items-center gap-4">
                    <a href="../index.html" class="text-sm text-secondary">View Site →</a>
                    <button id="logout-btn" class="btn btn-sm btn-outline">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="mb-8">
            <div class="flex justify-between items-center">
                <div>
                    <h1>Manage RTI Entries</h1>
                    <p class="text-secondary">View, edit, and delete RTI entries</p>
                </div>
                <div class="flex gap-3">
                    <button id="toggle-bin" class="btn btn-outline" onclick="toggleBinView()">🗑️ Recycle Bin</button>
                    <a href="upload.html" class="btn btn-primary">+ Add New RTI</a>
                </div>
            </div>
        </div>

        <!-- Search and Filter -->
        <div class="card mb-6">
            <div class="flex gap-4">
                <input type="text" id="search-box" placeholder="Search RTIs by subject, department, or disclosure..."
                    class="form-input" style="flex: 1;">
                <select id="filter-authority" class="form-select" style="width: 200px;">
                    <option value="">All Authorities</option>
                    <option value="Central">Central</option>
                    <option value="State">State</option>
                    <option value="Local">Local</option>
                </select>
            </div>
        </div>

        <!-- RTI List -->
        <div id="rti-list">
            <p class="text-center text-muted py-8">Loading RTI entries...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../config.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/github-api.js"></script>
    <script src="../assets/js/admin-auth.js"></script>

    <script>
        // Initialize auth
        const auth = initAdminAuth();
        const githubAPI = new GitHubAPI();
        let allRTIs = [];
        let isBinView = false;

        // Logout handler
        document.getElementById('logout-btn').addEventListener('click', function () {
            if (confirm('Are you sure you want to logout?')) {
                auth.logout();
            }
        });

        // Toggle Bin View
        window.toggleBinView = function () {
            isBinView = !isBinView;
            const btn = document.getElementById('toggle-bin');
            if (isBinView) {
                btn.classList.add('btn-primary');
                btn.classList.remove('btn-outline');
                btn.textContent = '⬅️ Back to Active';
            } else {
                btn.classList.remove('btn-primary');
                btn.classList.add('btn-outline');
                btn.textContent = '🗑️ Recycle Bin';
            }
            filterRTIs();
        }

        // Load RTI data
        async function loadRTIs() {
            try {
                const rtiDataFile = await githubAPI.getFile(GITHUB_CONFIG.dataPath);

                if (!rtiDataFile) {
                    document.getElementById('rti-list').innerHTML = `
            <div class="card text-center">
              <h3>No RTI data found</h3>
              <p class="text-secondary mb-4">Upload your first RTI to get started</p>
              <a href="upload.html" class="btn btn-primary">Upload RTI</a>
            </div>
          `;
                    return;
                }

                const rtiData = JSON.parse(rtiDataFile.content);
                allRTIs = rtiData.rtis || [];

                filterRTIs(); // Initial display

            } catch (error) {
                console.error('Error loading RTIs:', error);
                document.getElementById('rti-list').innerHTML = `
          <div class="card text-center text-error">
            <h3>Error Loading Data</h3>
            <p>${error.message}</p>
          </div>
        `;
            }
        }

        // Display RTI list
        function displayRTIs(rtis) {
            const listContainer = document.getElementById('rti-list');

            if (rtis.length === 0) {
                listContainer.innerHTML = `
          <div class="card text-center">
            <p class="text-muted">No ${isBinView ? 'deleted' : 'active'} RTIs found</p>
          </div>
        `;
                return;
            }

            const html = rtis.map((rti) => {
                // Determine original index for badge (approximate)
                const originalIndex = allRTIs.findIndex(r => r.id === rti.id);

                return `
        <div class="card mb-4" data-rti-id="${rti.id}" style="${isBinView ? 'border: 1px dashed var(--color-error);' : ''}">
          <div class="rti-card-header">
            <div>
              <span class="badge ${isBinView ? 'badge-error' : 'badge-primary'}">${isBinView ? 'DELETED' : '#' + (originalIndex + 1)}</span>
              <h3 class="rti-card-title mt-2">${rti.subject}</h3>
            </div>
            <span class="department-badge">${rti.department}</span>
          </div>
          
          <div class="rti-card-meta">
            <span>📅 ${rti.date || 'No date'}</span>
            <span>⚡ ${rti.authority}</span>
            <span>📍 ${rti.state || 'N/A'}</span>
            <span>👤 ${rti.uploadedBy}</span>
          </div>
          
          ${rti.disclosure ? `<p class="rti-card-disclosure">${rti.disclosure}</p>` : ''}
          
          <div class="rti-card-tags">
            ${(rti.tags || []).map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
          
          <div class="rti-actions">
            ${!isBinView ? `
                <a href="${rti.documentUrl}" target="_blank" class="btn btn-sm btn-outline">📄 View Document</a>
                <button onclick="softDeleteRTI('${rti.id}')" class="btn btn-sm" style="background: var(--color-error); color: white;">🗑️ Delete</button>
            ` : `
                <button onclick="restoreRTI('${rti.id}')" class="btn btn-sm btn-outline">♻️ Restore</button>
                <button onclick="permanentDeleteRTI('${rti.id}')" class="btn btn-sm btn-primary" style="background: darkred; border-color: darkred;">❌ Delete Forever</button>
            `}
          </div>
        </div>
      `}).join('');

            listContainer.innerHTML = html;
        }

        // Search functionality
        document.getElementById('search-box').addEventListener('input', debounce(function (e) {
            filterRTIs();
        }, 300));

        document.getElementById('filter-authority').addEventListener('change', function () {
            filterRTIs();
        });

        function filterRTIs() {
            const searchTerm = document.getElementById('search-box').value.toLowerCase();
            const authorityFilter = document.getElementById('filter-authority').value;

            // 1. Filter by Status (Bin vs Active)
            let filtered = allRTIs.filter(rti => {
                const isDeleted = rti.status === 'deleted';
                return isBinView ? isDeleted : !isDeleted;
            });

            // 2. Apply search
            if (searchTerm) {
                filtered = filtered.filter(rti => {
                    return (
                        rti.subject.toLowerCase().includes(searchTerm) ||
                        rti.department.toLowerCase().includes(searchTerm) ||
                        (rti.disclosure && rti.disclosure.toLowerCase().includes(searchTerm)) ||
                        (rti.tags && rti.tags.some(tag => tag.toLowerCase().includes(searchTerm)))
                    );
                });
            }

            // 3. Apply authority filter
            if (authorityFilter) {
                filtered = filtered.filter(rti => rti.authority === authorityFilter);
            }

            displayRTIs(filtered);
        }

        // Soft Delete RTI
        async function softDeleteRTI(rtiId) {
            if (!confirm('Move this RTI to the Recycle Bin?')) return;

            try {
                showToast('Moving to Bin...', 'info');
                await updateRTIStatus(rtiId, 'deleted');
                showToast('Moved to Recycle Bin', 'success');
            } catch (error) {
                console.error('Delete error:', error);
                showToast('Error: ' + error.message, 'error');
            }
        }

        // Restore RTI
        async function restoreRTI(rtiId) {
            try {
                showToast('Restoring...', 'info');
                await updateRTIStatus(rtiId, 'active'); // or just remove status
                showToast('Restored successfully', 'success');
            } catch (error) {
                console.error('Restore error:', error);
                showToast('Error: ' + error.message, 'error');
            }
        }

        // Helper to update status
        async function updateRTIStatus(rtiId, status) {
            const rtiDataFile = await githubAPI.getFile(GITHUB_CONFIG.dataPath);
            const rtiData = JSON.parse(rtiDataFile.content);

            const rti = rtiData.rtis.find(r => r.id === rtiId);
            if (!rti) throw new Error('RTI not found');

            if (status === 'active') {
                delete rti.status;
            } else {
                rti.status = status;
            }

            rtiData.metadata.lastUpdated = new Date().toISOString();

            const updatedContent = JSON.stringify(rtiData, null, 2);
            await githubAPI.updateFile(GITHUB_CONFIG.dataPath, updatedContent, rtiDataFile.sha, `Update RTI status: ${status}`);

            // Reload local data
            await loadRTIs();
        }

        // Permanent Delete
        async function permanentDeleteRTI(rtiId) {
            if (!confirm('PERMANENTLY DELETE? This cannot be undone.')) return;

            try {
                showToast('Deleting permanently...', 'info');

                const rtiDataFile = await githubAPI.getFile(GITHUB_CONFIG.dataPath);
                const rtiData = JSON.parse(rtiDataFile.content);

                const index = rtiData.rtis.findIndex(r => r.id === rtiId);
                if (index === -1) throw new Error('RTI not found');

                const rti = rtiData.rtis[index];
                rtiData.rtis.splice(index, 1);

                const updatedContent = JSON.stringify(rtiData, null, 2);
                await githubAPI.updateFile(GITHUB_CONFIG.dataPath, updatedContent, rtiDataFile.sha, `Permanent Delete: ${rti.subject}`);

                showToast('Deleted permanently', 'success');
                await loadRTIs();

            } catch (error) {
                console.error('Delete error:', error);
                showToast('Error: ' + error.message, 'error');
            }
        }

        // Load RTIs on page load
        loadRTIs();
    </script>
</body>

</html>
